[pytest]
# Only collect the real suite under tests/.
testpaths = tests
norecursedirs = venv backend data scripts static templates .git .idea
addopts = -ra --strict-markers
markers =
    e2e: browser-driven UI tests (Playwright + local Chrome)
    slow: tests that take more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL:Warning
