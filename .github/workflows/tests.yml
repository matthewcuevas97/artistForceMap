name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-api:
    name: unit + API
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9 builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pyflakes
        run: python -m pyflakes app.py app_universal.py web_auth.py backend spotify lastfm data scripts tests/conftest.py tests/unit tests/api tests/e2e/conftest.py tests/e2e/test_*.py
      - name: pytest (no browser)
        run: python -m pytest -m "not e2e"

  e2e:
    name: browser (Playwright)
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9 builds
    needs: unit-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: pytest (browser)
        env:
          PW_CHANNEL: chromium
          PERF_BUDGET_MS: "1000"  # shared runners are slower; still catches the old ~800 ms (local) regression
        run: python -m pytest -m e2e
